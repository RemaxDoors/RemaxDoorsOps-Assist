name: Build and deploy Remax Doors Ops Assist

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22.x"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Must precede the typecheck: `next build` writes next-env.d.ts, which
      # supplies the ambient declarations for static asset imports (the logo).
      # Running tsc first fails on a file Next has not generated yet.
      #
      # The build stamps itself with the commit and the time. Both are
      # substituted into the bundle here and cannot be recovered later — the
      # deployed artifact has no .git directory — so a UAT report can name the
      # exact build it came from.
      - name: Build application
        env:
          NEXT_PUBLIC_BUILD_COMMIT: ${{ github.sha }}
        run: |
          export NEXT_PUBLIC_BUILD_COMMIT="${NEXT_PUBLIC_BUILD_COMMIT:0:7}"
          export NEXT_PUBLIC_BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "Building $(node -p "require('./package.json').version") @ $NEXT_PUBLIC_BUILD_COMMIT"
          npm run build

      - name: Typecheck
        run: npm run --if-present typecheck

      # Build-time only from here on: TypeScript, Tailwind and Playwright are
      # ~200MB that App Service would otherwise unpack on every deploy.
      - name: Drop development dependencies
        run: npm prune --omit=dev

      # App Service runs `npm start` against a prebuilt tree, so node_modules
      # and .next ship with it. Zipping first keeps the artifact one file
      # instead of ~40,000, which is the difference between a deploy that
      # takes a minute and one that takes twenty. `.next/cache` is 75MB of
      # incremental build state the server never reads.
      - name: Package for deployment
        run: |
          zip -r -q --symlinks release.zip . \
            -x '.git/*' '.next/cache/*' 'tests/*' 'test-results/*' \
               'playwright-report/*' 'blob-report/*' 'release.zip'
          ls -lh release.zip

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: release.zip
          retention-days: 7

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download deployment artifact
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: "RemaxDoorsOps-Assist"
          package: release.zip
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_503B0979632F48E3996482F9E5749224 }}
